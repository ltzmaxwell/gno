name: ci / gnovm

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - gnovm/**
      - tm2/** # GnoVM has a dependency on TM2 types
      - examples/** # gnovm has some tests that depend on examples
      # We trigger the testing workflow for changes to the main go.mod,
      # since this can affect test results
      - go.mod
      - .github/workflows/ci-dir-gnovm.yml
      # *.md is prose, except in the gno source trees where it is valid
      # mempackage content (see gnovm/pkg/gnolang/mempackage.go goodFileXtns).
      # Order matters: a later positive pattern wins over an earlier negation.
      - '!**/*.md'
      - examples/**/*.md
      - gnovm/stdlibs/**/*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    uses: ./.github/workflows/_ci-go.yml
    with:
      modulepath: "gnovm"
      tests-extra-args: "-coverpkg=github.com/gnolang/gno/gnovm/..."
  stdlibs:
    uses: ./.github/workflows/_ci-gno.yml
    with:
      path: "gnovm/stdlibs"
  # The debugAssert build tag turns on the realm and store invariant
  # checks (object ownership, hash chain); the plain suite never runs them.
  debugassert:
    name: test (debugAssert)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go test with -tags debugAssert
        working-directory: gnovm
        run: go test -tags debugAssert -timeout 30m ./pkg/gnolang/... ./pkg/test/...
